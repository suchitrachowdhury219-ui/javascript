    function clickHandler(color){
       // document.body.style.backgroundColor=`${color}`
        return function(){
        document.body.style.backgroundColor=`${color}`
       }
    }
    document.getElementById('orange').onclick=clickHandler("orange");
    document.getElementById('green').onclick=clickHandler("green");
      //this is happening because of lexical scoping (a function can access variables from its outer/parent scope)
      //closure is created when a function remembers its lexical scope even after the outer function has finished executing
