<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html events</title>
</head>
<body style="background-color: lightcoral;">
    <h2>Amazing images</h2>
    <div>
        <ul id="images">
            <li><img id="picture" src="https://www.w3schools.com/images/picture.jpg" alt="Image 1" width="200px"></li>

            <li><img id="forest" src="https://media.istockphoto.com/id/1419410282/photo/silent-forest-in-spring-with-beautiful-bright-sun-rays.jpg?s=612x612&w=0&k=20&c=UHeb1pGOw6ozr6utsenXHhV19vW6oiPIxDqhKCS2Llk=" alt="Image 3" width="200px" ></li>
            <li><a style="color:rgb(2, 17, 30);" href="https://google.com" id="google">Google</a></li>
        </ul>
    </div>
</body>
<script>
    //1.document.getElementById=('desert').onclick=function(){
        //alert("desert clicked");}

    //2.attachEvent()
        //jQuery-on

     //3.u should use eventlistners coz its just not provide onclick functionality but also ability for propagation

            alert('desert clicked')
    },false)



</script>
</html>
