<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color:aquamarine;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li=document.createElement('li');
        li.innerHTML=`${langName}`
        document.querySelector('.language').appendChild(li)
        }
        addLanguage("python")
        addLanguage("typescript")   //this is not an optimized way as it have to traverse a whole tree to reach the last node and in large scale project it is not an optimized way
    
    function addOptiLanguage(langName){
       const li=document.createElement('li');
       li.appendChild(document.createTextNode(langName))  
       document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage("golang")
    //it is optimized way as we have to create  a li and add a textNode then append it

    //Edit
    const secLang=document.querySelector("li:nth-child(2)")
    //secLang.innerHTML="Mojo" used but not optimized way
   const newLi= document.createElement('li')
   newLi.textContent="mojo"
   secLang.replaceWith(newLi)


   //edit
   const firstLang=document.querySelector("li:first-child")
   firstLang.outerHTML="<li>golang</li>"

   //remove 
   const lastlanguage=document.querySelector('li:last-child')
   lastlanguage.remove()


</script>
</html>
